<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MeetMind{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Marked.js для рендера Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Навбар -->
    <nav class="navbar">
        <div class="navbar-left">
            <a href="/" class="navbar-logo">
                <span class="navbar-emoji">🎙️</span>
                <span class="navbar-title">MeetMind</span>
            </a>
        </div>

        <div class="navbar-right">
            <div class="daemon-status">
                <span class="daemon-indicator" id="daemonIndicator"></span>
                <span class="daemon-text" id="daemonText">Демон</span>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Модальное окно для добавления встречи -->
    <div class="modal" id="addMeetingModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">
                    <span class="modal-emoji">🔗</span>
                    Новая встреча
                </span>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>

            <div class="modal-body">
                <div class="form-group">
                    <label for="meetingUrl">Ссылка на встречу</label>
                    <input
                        type="url"
                        id="meetingUrl"
                        class="form-input"
                        placeholder="https://meet.google.com/..."
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="meetingTitle">Название (опционально)</label>
                    <input
                        type="text"
                        id="meetingTitle"
                        class="form-input"
                        placeholder="Название встречи"
                    >
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" id="modalCancelBtn">Отмена</button>
                <button class="btn btn-primary" id="modalSubmitBtn">
                    <span class="btn-emoji">🚀</span>
                    Начать запись
                </button>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
