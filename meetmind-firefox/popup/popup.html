<\!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetMind</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🎙️</div>
      <h1>MeetMind</h1>
    </div>

    <div class="status-section">
      <div class="status-indicator" id="statusIndicator">
        <div class="status-dot disconnected"></div>
        <span id="statusText">Подключение...</span>
      </div>
    </div>

    <div class="meeting-info">
      <div class="info-item">
        <label>Встреча:</label>
        <span id="meetingId">-</span>
      </div>
      <div class="info-item">
        <label>Статус:</label>
        <span id="connectionStatus">Инициализация...</span>
      </div>
    </div>

    <div class="action-buttons">
      <button id="reconnectBtn" class="btn btn-primary">Переподключиться</button>
      <button id="helpBtn" class="btn btn-secondary">Помощь</button>
    </div>

    <div class="footer">
      <p class="version">v1.0.0</p>
      <p class="info-text">Убедитесь что локальный WebSocket сервер запущен на ws://localhost:8765</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
