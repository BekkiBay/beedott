[project]
name = "meetmind"
version = "3.0.0"
description = "Локальный ИИ-секретарь встреч для macOS"
requires-python = ">=3.11"
dependencies = [
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "numpy",
  "mlx-whisper>=0.4; platform_machine=='arm64'",
  "requests>=2.31",
  "python-telegram-bot>=22",
  "python-dotenv>=1.0",
  "psutil>=5.9",
  "anthropic>=1.13",
]

[dependency-groups]
dev = [
    "pyobjc-framework-coreaudio>=12.2.1",
    "pytest>=8",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not hardware'"
markers = [
  "slow: скачивание/инференс модели (запуск: pytest -m slow)",
  "hardware: нужно реальное аудио-устройство и TCC-разрешение (pytest -m hardware)",
]
